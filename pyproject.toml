[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-lab-framework"
version = "1.3.0"
description = "Local-first end-to-end machine learning data and pretraining pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "pyyaml>=6.0,<7", "requests>=2.31,<3", "beautifulsoup4>=4.12,<5", "lxml>=6.1,<7", "numpy>=1.26,<3", "packaging>=23.0,<26",
  "tokenizers>=0.19,<1", "safetensors>=0.4,<1", "datasets>=5.0.1,<6", "huggingface_hub>=0.23,<2", "trafilatura>=1.12,<3", "langdetect>=1.0.9,<2",
  "pypdf>=5.0,<7", "openpyxl>=3.1,<4", "python-docx>=1.1,<2", "python-pptx>=0.6.23,<2", "fastapi>=0.141.1,<1", "starlette>=1.3.1,<2",
  "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "pydantic>=2.0,<3", "httpx>=0.27,<1", "cryptography>=49.0,<51",
]

[project.scripts]
mlab = "run_pipeline:main"

[tool.setuptools]
include-package-data = true
py-modules = ["run_pipeline"]

[tool.setuptools.packages.find]
include = ["pipeline*", "command_center*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".pytest_cache", ".ruff_cache", ".runtime", "__pycache__", "datasets", "output", "scratch", "ui/screens/__init__.py.bak", "ui/screens/__init__.py.bak.20260817_094313"]

[tool.ruff.lint]
select = ["E4", "F"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110", "PLW1510"]
"scripts/**" = ["UP031"]
"tests/test_runtime.py" = ["E402"]
"ui/screens/**" = ["F403", "F405"]
"ui/core/application.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=command_center.config --cov=command_center.secrets --cov=command_center.service --cov=command_center.web --cov=pipeline.config_validation --cov=pipeline.contracts.run --cov=pipeline.doctor --cov=pipeline.embedder.semantic_dedup --cov=pipeline.filtering.quality_filter --cov=pipeline.filtering.reporter --cov=pipeline.integrity --cov=pipeline.types --cov=pipeline.weighter.weighter --cov=scripts.export_cards --cov=scripts.reconcile_environment --cov=scripts.runtime --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true
parallel = true
source = ["command_center.config", "command_center.secrets", "command_center.service", "command_center.web", "pipeline.config_validation", "pipeline.contracts.run", "pipeline.doctor", "pipeline.embedder.semantic_dedup", "pipeline.filtering.quality_filter", "pipeline.filtering.reporter", "pipeline.integrity", "pipeline.types", "pipeline.weighter.weighter", "scripts.export_cards", "scripts.reconcile_environment", "scripts.runtime"]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_also = ["if __name__ == .__main__:", "raise NotImplementedError"]
