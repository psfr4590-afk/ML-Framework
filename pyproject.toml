[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".runtime",
    "__pycache__",
    "datasets",
    "output",
    "scratch",
    "ui/screens/__init__.py.bak",
    "ui/screens/__init__.py.bak.20260817_094313",
]

[tool.ruff.lint]
# The repository contains older compact modules that are intentionally not
# reformatted as part of the release-hardening pass. Keep CI focused on
# correctness errors while leaving presentation cleanup as a separate task.
select = ["E4", "F"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110", "PLW1510"]
"scripts/**" = ["UP031"]
"tests/test_runtime.py" = ["E402"]
