[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-lab-framework"
version = "1.3.0"
description = "Local-first end-to-end machine learning data and pretraining pipeline"
readme = "README.md"
# Keep the supported interpreter range explicit so pip fails cleanly on
# unsupported Python versions instead of attempting incompatible native builds.
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}

# Runtime dependencies intentionally mirror requirements.txt, except for
# PyTorch. bootstrap.py installs PyTorch separately so it can select a
# host-appropriate wheel instead of forcing a large CUDA build on every user.
dependencies = [
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "lxml>=6.1,<7",
  "numpy>=1.26,<3",
  "packaging>=23.0,<26",
  "tokenizers>=0.19,<1",
  "safetensors>=0.4,<1",
  "datasets>=5.0.1,<6",
  "huggingface_hub>=0.23,<2",
  "trafilatura>=1.12,<3",
  "langdetect>=1.0.9,<2",
  "pypdf>=5.0,<7",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "python-pptx>=0.6.23,<2",
  "fastapi>=0.141.1,<1",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.0,<3",
  "httpx>=0.27,<1",
  "cryptography>=49.0,<51",
]

[project.scripts]
mlab = "run_pipeline:main"

[tool.setuptools]
include-package-data = true
py-modules = ["run_pipeline"]

[tool.setuptools.packages.find]
include = ["pipeline*", "command_center*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".runtime",
    "__pycache__",
    "datasets",
    "output",
    "scratch",
    "ui/screens/__init__.py.bak",
    "ui/screens/__init__.py.bak.20260817_094313",
]

[tool.ruff.lint]
select = ["E4", "F"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110", "PLW1510"]
"scripts/**" = ["UP031"]
"tests/test_runtime.py" = ["E402"]
