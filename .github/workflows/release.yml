name: Release Gate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and release dependencies
        run: pip install -r requirements-dev.txt
      - name: Install security gate tooling
        run: pip install -r requirements-security.txt
      - name: Install package metadata
        run: pip install . --no-deps
      - name: Security gate
        run: python scripts/security_gate.py
      - name: Dependency and SBOM evidence
        run: python scripts/generate_release_evidence.py
      - name: Production release verification
        run: python scripts/verify_release.py --bootstrap-native
      - name: Upload release evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: release-evidence
          path: release-evidence/
          if-no-files-found: error
