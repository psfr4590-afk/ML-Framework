name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      # Match the canonical bootstrap path: core dependencies and host-specific
      # PyTorch are resolved from separate requirement files.
      - name: Install CPU PyTorch
        run: pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Install package metadata
        run: pip install . --no-deps
      - name: Lint
        run: ruff check --select F command_center pipeline tests scripts run_pipeline.py launch.py bootstrap.py run_command_center.py
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: python -m pytest -q

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        shell: pwsh
        run: pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        shell: pwsh
        run: pip install -r requirements.txt
      - name: Install package metadata
        shell: pwsh
        run: pip install . --no-deps
      - name: Lint
        shell: pwsh
        run: ruff check --select F command_center pipeline tests scripts run_pipeline.py launch.py bootstrap.py run_command_center.py
      - name: Compile
        shell: pwsh
        run: python -m compileall -q .
      - name: Test
        shell: pwsh
        run: python -m pytest -q

  windows-script-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell bootstrap
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/bootstrap_llama_cpp.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Validate PowerShell bootstrap contract
        shell: pwsh
        run: |
          $source = Get-Content -Raw -Encoding UTF8 'scripts/bootstrap_llama_cpp.ps1'
          $required = @(
            '$Tag = "b10516"',
            '$Commit = "b95502b"',
            'convert_hf_to_gguf.py',
            'llama-quantize',
            '-DGGML_NATIVE=OFF',
            '-DGGML_OPENMP=OFF'
          )
          foreach ($needle in $required) {
            if ($source -notlike "*$needle*") {
              throw "Missing PowerShell bootstrap contract: $needle"
            }
          }
