name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Match the canonical bootstrap path: core dependencies and host-specific
      # PyTorch are resolved from separate requirement files.
      - name: Install CPU PyTorch
        run: pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Install package metadata
        run: pip install . --no-deps
      - name: Lint
        run: ruff check --select F command_center pipeline tests scripts run_pipeline.py launch.py bootstrap.py run_command_center.py
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: python -m pytest -q
