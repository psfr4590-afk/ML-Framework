name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        run: pip install -r requirements-dev.txt
      - name: Install package metadata
        run: pip install . --no-deps
      - name: Bootstrap doctor
        run: python bootstrap.py --doctor
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check --select F --extend-per-file-ignores pipeline/orchestrator.py:F401 command_center pipeline tests scripts ui run_pipeline.py launch.py bootstrap.py run_command_center.py
      - name: Compile
        run: python -m compileall -q .
      - name: Test and coverage gate
        run: python -m pytest -q

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        shell: pwsh
        run: pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        shell: pwsh
        run: pip install -r requirements-dev.txt
      - name: Install package metadata
        shell: pwsh
        run: pip install . --no-deps
      - name: Bootstrap doctor
        shell: pwsh
        run: python bootstrap.py --doctor
      - name: Dependency consistency
        shell: pwsh
        run: python -m pip check
      - name: Lint
        shell: pwsh
        run: ruff check --select F --extend-per-file-ignores pipeline/orchestrator.py:F401 command_center pipeline tests scripts ui run_pipeline.py launch.py bootstrap.py run_command_center.py
      - name: Compile
        shell: pwsh
        run: python -m compileall -q .
      - name: Test and coverage gate
        shell: pwsh
        run: python -m pytest -q

  windows-script-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse PowerShell bootstrap
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/bootstrap_llama_cpp.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: Validate PowerShell bootstrap contract
        shell: pwsh
        run: |
          $source = Get-Content -Raw -Encoding UTF8 'scripts/bootstrap_llama_cpp.ps1'
          $required = @('$Tag = "b10516"','$Commit = "b95502b"','convert_hf_to_gguf.py','llama-quantize','llama-cli','-DGGML_NATIVE=OFF','-DGGML_OPENMP=OFF')
          foreach ($needle in $required) { if ($source -notlike "*$needle*") { throw "Missing PowerShell bootstrap contract: $needle" } }
